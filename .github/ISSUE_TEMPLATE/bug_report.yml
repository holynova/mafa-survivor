name: 游戏测试反馈
description: 记录版本、复现步骤和截图，帮助定位问题。
title: "[测试反馈] "
body:
  - type: input
    id: version
    attributes:
      label: 页面版本号与提交号
      description: 复制页面左下角显示的信息。
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 浏览器、设备与操作系统
  - type: textarea
    id: steps
    attributes:
      label: 如何复现，以及预期与实际表现
    validations:
      required: true
  - type: textarea
    id: screenshot
    attributes:
      label: 截图或录屏
