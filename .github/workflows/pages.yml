name: Stage release and Pages
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-stage-release
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build the approved public asset profile
        run: npm run build:pages
        env:
          PAGES_ASSET_MODE: ${{ vars.PAGES_ASSET_MODE }}
          BASE_PATH: /mafa-survivor/
          VITE_RELEASE_VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          VITE_GIT_SHA: ${{ github.sha }}
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the verified artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Publish this stage after successful deployment
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          STAGE_TAG: ${{ github.ref_name }}
          DEMO_URL: ${{ needs.deploy.outputs.url }}
        run: |
          node tools/release-notes.mjs > /tmp/stage-release.md
          if gh release view "$STAGE_TAG" >/dev/null 2>&1; then
            echo 'This stage release already exists.'
          else
            gh release create "$STAGE_TAG" --verify-tag --title "$STAGE_TAG · 阶段测试版" --notes-file /tmp/stage-release.md --prerelease
          fi
