name: Source checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Verify native map audit without downloading game assets
        run: python -m unittest discover -s tools -p 'test_native_map_audit.py'
      - run: npm run build:pages
        env:
          PAGES_ASSET_MODE: graybox
          BASE_PATH: /mafa-survivor/
          VITE_GIT_SHA: ${{ github.sha }}
